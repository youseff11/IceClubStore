<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ice Club</title>
    <link rel="icon" type="image/jpeg" href="/static/images/icon.jpg">

    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '792214427202379');
    fbq('track', 'PageView');
    </script>
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=792214427202379&ev=PageView&noscript=1"
    /></noscript>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    {% include 'navbar.html' %}

    {% if messages and request.resolver_match.url_name != 'dashboard' %}
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                {% for message in messages %}
                    Swal.fire({
                        icon: '{% if message.tags == "error" %}error{% elif message.tags == "warning" %}warning{% else %}success{% endif %}',
                        title: 'Notification',
                        text: '{{ message }}',
                        confirmButtonColor: '#4fc3f7',
                        timer: 3500,
                        timerProgressBar: true
                    });
                {% endfor %}
            });
        </script>
    {% endif %}

    {% block content %}
    {% endblock %}

    {% include 'footer.html' %}
</body>
</html>
