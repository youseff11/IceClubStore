{% extends 'base.html' %} 
{% block content %}
<style>
    :root {
        --primary-color: #4fc3f7;
        --secondary-color: #0f2027;
        --accent-gradient: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        --glass-border: rgba(255, 255, 255, 0.1);
        --transition-smooth: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .checkout-wrapper {
        padding: 80px 20px 40px;
        background: var(--accent-gradient);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #fff;
    }

    .checkout-container-outer {
        position: relative;
        max-width: 900px;
        width: 100%;
        border-radius: 30px;
        overflow: hidden;
        padding: 2px;
        box-shadow: 0 40px 80px rgba(0,0,0,0.6);
    }

    .checkout-container-outer::before {
        content: '';
        position: absolute;
        width: 200%;
        height: 200%;
        top: -50%;
        left: -50%;
        background-image: conic-gradient(transparent, transparent, transparent, var(--primary-color));
        animation: rotateLight 6s linear infinite;
        z-index: 1;
    }

    @keyframes rotateLight {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    .checkout-container {
        position: relative;
        z-index: 5;
        width: 100%;
        background: #0f2027;
        backdrop-filter: blur(15px);
        border-radius: 28px;
        padding: 40px 30px;
    }

    .checkout-header {
        text-align: center;
        margin-bottom: 30px;
    }

    .checkout-header h2 {
        font-size: clamp(1.8rem, 5vw, 2.5rem);
        margin-bottom: 10px;
        font-weight: 800;
    }

    .checkout-header p {
        opacity: 0.6;
        font-size: 0.95rem;
    }

    .checkout-form {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .form-group.full-width {
        grid-column: span 2;
    }

    .form-group label {
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--primary-color);
        text-transform: uppercase;
        letter-spacing: 1px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .form-group input, .form-group select, .form-group textarea {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--glass-border);
        padding: 12px 15px;
        border-radius: 12px;
        color: #fff;
        font-size: 1rem;
        width: 100%;
        box-sizing: border-box;
        transition: var(--transition-smooth);
    }

    select option {
        color: #000;
        background-color: #fff;
    }

    .form-group input:focus, .form-group select:focus {
        outline: none;
        border-color: var(--primary-color);
        background: rgba(255, 255, 255, 0.1);
        box-shadow: 0 0 15px rgba(79, 195, 247, 0.2);
    }

    .order-summary-box {
        background: rgba(79, 195, 247, 0.07);
        padding: 20px;
        border-radius: 18px;
        border: 1px dashed rgba(79, 195, 247, 0.3);
        margin-top: 10px;
    }

    .summary-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
    }

    .summary-label {
        font-size: 1.1rem;
        opacity: 0.9;
    }

    .summary-value {
        font-size: 1.4rem;
        color: var(--primary-color);
        font-weight: 800;
    }

    .submit-area {
        grid-column: span 2;
        margin-top: 20px;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .btn-confirm {
        background: var(--primary-color);
        color: var(--secondary-color);
        padding: 16px;
        border-radius: 15px;
        border: none;
        font-size: 1.1rem;
        font-weight: 800;
        cursor: pointer;
        transition: var(--transition-smooth);
        text-align: center;
        text-decoration: none;
        box-shadow: 0 10px 20px rgba(79, 195, 247, 0.3);
    }

    .btn-confirm:hover {
        background: #fff;
        transform: translateY(-3px);
        box-shadow: 0 15px 30px rgba(255, 255, 255, 0.1);
    }

    .btn-back-cart {
        text-align: center;
        color: rgba(255,255,255,0.6);
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 500;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: 0.3s;
    }

    .btn-back-cart:hover {
        color: var(--primary-color);
    }

    @media (max-width: 768px) {
        .checkout-form { grid-template-columns: 1fr; }
        .form-group.full-width, .submit-area { grid-column: span 1; }
        .checkout-container { padding: 30px 20px; }
    }
</style>

<div class="checkout-wrapper">
    <div class="checkout-container-outer">
        <div class="checkout-container">
            
            <div class="checkout-header">
                <h2>Complete Your <span style="color: var(--primary-color);">Order</span></h2>
                <p>Fast & secure checkout. Please fill in your delivery details.</p>
            </div>

            <form action="{% url 'checkout' %}" method="POST" class="checkout-form">
                {% csrf_token %}
                
                <div class="form-group full-width">
                    <label><i class="fas fa-user"></i> Full Name</label>
                    <input type="text" name="name" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email Address</label>
                    <input type="email" name="email" placeholder="example@mail.com" required>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-phone"></i> Phone Number</label>
                    <input type="tel" name="phone" placeholder="01xxxxxxxxx" required>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-city"></i> Governorate</label>
                    <select name="governorate" required>
                        <option value="" disabled selected>Select your city</option>
                        <option value="Cairo">Cairo</option>
                        <option value="Giza">Giza</option>
                        <option value="Alexandria">Alexandria</option>
                        <option value="Dakahlia">Dakahlia</option>
                        <option value="Red Sea">Red Sea</option>
                        <option value="Beheira">Beheira</option>
                        <option value="Fayoum">Fayoum</option>
                        <option value="Gharbia">Gharbia</option>
                        <option value="Ismailia">Ismailia</option>
                        <option value="Monufia">Monufia</option>
                        <option value="Minya">Minya</option>
                        <option value="Qalyubia">Qalyubia</option>
                        <option value="New Valley">New Valley</option>
                        <option value="Suez">Suez</option>
                        <option value="Aswan">Aswan</option>
                        <option value="Assiut">Assiut</option>
                        <option value="Beni Suef">Beni Suef</option>
                        <option value="Port Said">Port Said</option>
                        <option value="Damietta">Damietta</option>
                        <option value="Sharkia">Sharkia</option>
                        <option value="South Sinai">South Sinai</option>
                        <option value="Kafr El Sheikh">Kafr El Sheikh</option>
                        <option value="Matrouh">Matrouh</option>
                        <option value="Luxor">Luxor</option>
                        <option value="Qena">Qena</option>
                        <option value="North Sinai">North Sinai</option>
                        <option value="Sohag">Sohag</option>
                    </select>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-map-marker-alt"></i> Detailed Address</label>
                    <input type="text" name="address" placeholder="Street, Building, Apartment" required>
                </div>

                <div class="form-group full-width">
                    <div class="order-summary-box">
                        <div class="summary-item">
                            <span class="summary-label">Order Total:</span>
                            <span class="summary-value">{{ total_price|floatformat:0 }} LE</span>
                        </div>
                        <p style="font-size: 0.8rem; margin-top: 15px; opacity: 0.8; text-align: center; color: var(--primary-color);">
                            <i class="fas fa-envelope-open-text"></i> You will receive an email with order details.
                        </p>
                    </div>
                </div>

                <div class="submit-area">
                    <button type="submit" class="btn-confirm">CONFIRM ORDER</button>
                    <a href="{% url 'cart_view' %}" class="btn-back-cart">
                        <i class="fas fa-arrow-left"></i> Back to Shopping Cart
                    </a>
                </div>

            </form>
        </div>
    </div>
</div>

<script>
  // 1. حدث بدء الدفع في فيسبوك
  if (typeof fbq !== 'undefined') {
    fbq('track', 'InitiateCheckout', {
      value: {{ total_price }},
      currency: 'EGP',
      content_category: 'Checkout'
    });
  }

  // 2. تتبع إضافة المعلومات
  const checkoutForm = document.querySelector('.checkout-form');
  const formInputs = checkoutForm.querySelectorAll('input, select');
  
  let infoTracked = false;
  formInputs.forEach(input => {
    input.addEventListener('input', function() {
      if (!infoTracked && typeof fbq !== 'undefined') {
        fbq('track', 'AddPaymentInfo', {
          content_category: 'Checkout',
          value: {{ total_price }},
          currency: 'EGP'
        });
        infoTracked = true;
      }
    });
  });

  // 3. تتبع محاولة الإرسال
  checkoutForm.addEventListener('submit', function() {
    if (typeof fbq !== 'undefined') {
        fbq('trackCustom', 'AttemptedOrderConfirmation', {
            total_value: {{ total_price }}
        });
    }
  });
</script>
{% endblock %}
